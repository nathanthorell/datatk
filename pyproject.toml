[project]
name = "datatk"
version = "0.1.0"
description = "A CLI toolkit for comparing, analyzing, and exporting data across databases and file formats."
authors = [{ name = "Nathan Thorell" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Environment :: Console",
    "Topic :: Database",
]

dependencies = [
    "pyodbc",
    "psycopg2-binary",
    "databricks-sql-connector",
    "databricks-sqlalchemy",
    "python-dotenv",
    "rich",
    "sqlalchemy",
    "pandas",
    "pyarrow",
    "pydbml",
    "pydantic>=2.12",
    "typer",
    "azure-identity",
]

[project.urls]
Homepage = "https://github.com/nathanthorell/datatk"
Repository = "https://github.com/nathanthorell/datatk"
Issues = "https://github.com/nathanthorell/datatk/issues"


[project.optional-dependencies]
dev = ["ruff", "mypy", "pandas-stubs", "types-psycopg2"]

[project.scripts]
datatk = "datatk.cli:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "./src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
target-version = "py313"
indent-width = 4
line-length = 100
exclude = ["*.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "C90"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.mypy]
mypy_path = "src"
disallow_untyped_defs = true
python_version = "3.13"
warn_return_any = true
strict = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
explicit_package_bases = true
namespace_packages = true
exclude = ["temp/.*"]

[[tool.mypy.overrides]]
module = [
    "pyodbc",
    "pydbml",
    "pydbml.*",
    "databricks",
    "databricks.*",
    "conftest",
]
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ty]
# ty type checker (Astral's new type checker)

[tool.ty.environment]
python-version = "3.13"
python = ".venv"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unused-ignore-comment = "ignore"
# Ignore for modules without type stubs
unresolved-import = "warn"
